

<!-- section slider  -->
<section class="slider">
    <owl-carousel-o [options]="mainSliderOptions" class="custom-owl">
        <ng-template carouselSlide><img class="vh-100" src="./assets/main-slider/1.jpg" alt="Slide1"></ng-template>  
        <ng-template carouselSlide><img class="vh-100" src="./assets/main-slider/2.jpg" alt="Slide2"></ng-template>  
        <ng-template carouselSlide><img class="vh-100" src="./assets/main-slider/3.jpg" alt="Slide3"></ng-template>  
      </owl-carousel-o>

</section>

<!-- section products -->
<div *ngIf="products.length < 1" class="spinner-border text-warning justify-content-center text-center" style="width: 3rem; height: 3rem;" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
<section *ngIf="products.length > 0" class="" >

    <div class="container-fluid">
        <h1 class="h1">Pobular Products</h1>
        <div class="row justify-content-center text-center">
            <div *ngFor="let product of products "  class="row col-sm-6 col-md-4 col-lg-3 col-xl-2 product justify-content-center text-center">
                <p>{{product.category.enName}}</p>    
                <img *ngIf="product.images.length == 0" class="w-100" src="../../../assets/products/2.jpg" [alt]="product.enName" [title]="product.enName">
                    <div *ngFor="let image of product.images" class="">
                        
                        <img class="w-100" [src]="image.imageUrl" [alt]="product.enName" [title]="product.enName">
                        
                    </div>
                    <!--  -->
                    
                        <h6 >{{product.enName}}</h6>
                        <span>{{product.price | currency:"EGP"}}</span> 
            </div>
                
        </div>
                    
                
                                
        

        
        </div>

</section>
