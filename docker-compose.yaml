services:
  db:
    image: postgres
    restart: always
    container_name: resala-db
    healthcheck:
      test: ['CMD', 'pg_isready -U postgres']
      interval: 15s
      timeout: 10s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432

  s3:
    image: minio/minio
    restart: always
    container_name: resala-s3
    environment:
      MINIO_ROOT_USER: minio_key
      MINIO_ROOT_PASSWORD: minio_secret
    ports:
      - 9000:9000
      - 9001:9001
    command: minio server /data --console-address :9001
