<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .center {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .success {
        display: none;
        color: green;
        font-size: large;
        font-weight: 600;
      }

      .error {
        display: none;
        color: red;
        font-size: large;
        font-weight: 600;
      }

      .loader {
        position: relative;
        width: 54px;
        height: 54px;
        border-radius: 10px;
      }

      .loader div {
        width: 8%;
        height: 24%;
        background: rgb(128, 128, 128);
        position: absolute;
        left: 50%;
        top: 30%;
        opacity: 0;
        border-radius: 50px;
        box-shadow: 0 0 3px rgba(0, 0, 0, 0.2);
        animation: fade458 1s linear infinite;
      }

      @keyframes fade458 {
        from {
          opacity: 1;
        }

        to {
          opacity: 0.25;
        }
      }

      .loader .bar1 {
        transform: rotate(0deg) translate(0, -130%);
        animation-delay: 0s;
      }

      .loader .bar2 {
        transform: rotate(30deg) translate(0, -130%);
        animation-delay: -1.1s;
      }

      .loader .bar3 {
        transform: rotate(60deg) translate(0, -130%);
        animation-delay: -1s;
      }

      .loader .bar4 {
        transform: rotate(90deg) translate(0, -130%);
        animation-delay: -0.9s;
      }

      .loader .bar5 {
        transform: rotate(120deg) translate(0, -130%);
        animation-delay: -0.8s;
      }

      .loader .bar6 {
        transform: rotate(150deg) translate(0, -130%);
        animation-delay: -0.7s;
      }

      .loader .bar7 {
        transform: rotate(180deg) translate(0, -130%);
        animation-delay: -0.6s;
      }

      .loader .bar8 {
        transform: rotate(210deg) translate(0, -130%);
        animation-delay: -0.5s;
      }

      .loader .bar9 {
        transform: rotate(240deg) translate(0, -130%);
        animation-delay: -0.4s;
      }

      .loader .bar10 {
        transform: rotate(270deg) translate(0, -130%);
        animation-delay: -0.3s;
      }

      .loader .bar11 {
        transform: rotate(300deg) translate(0, -130%);
        animation-delay: -0.2s;
      }

      .loader .bar12 {
        transform: rotate(330deg) translate(0, -130%);
        animation-delay: -0.1s;
      }
    </style>
  </head>
  <body>
    <main id="root">
      <section id="loading" class="center loading">
        <div class="loader">
          <div class="bar1"></div>
          <div class="bar2"></div>
          <div class="bar3"></div>
          <div class="bar4"></div>
          <div class="bar5"></div>
          <div class="bar6"></div>
          <div class="bar7"></div>
          <div class="bar8"></div>
          <div class="bar9"></div>
          <div class="bar10"></div>
          <div class="bar11"></div>
          <div class="bar12"></div>
        </div>
        <span>Verifying email...</span>
      </section>
      <section class="center success"></section>
      <section class="center error"></section>
    </main>

    <script>
      const loaderEl = document.getElementById('loading');
      const successEl = document.querySelector('.success');
      const errorEl = document.querySelector('.error');

      (async () => {
        const searchParam = new URLSearchParams(window.location.search);
        const token = searchParam.get('token');
        const email = searchParam.get('email');
        window.history.replaceState({}, document.title, window.location.pathname);

        try {
          const data = await fetch('/api/v1/auth/verify-email', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ token, email }),
          }).then(res => res.json());

          if (!data.success) {
            throw new Error(data.message || 'An error occurred');
          }

          successEl.style.display = 'block';
          successEl.textContent = 'Email verified successfully';
        } catch (e) {
          console.error(e);
          errorEl.style.display = 'block';
          errorEl.textContent = e.message;
        } finally {
          loaderEl.style.display = 'none';
        }
      })();
    </script>
  </body>
</html>
