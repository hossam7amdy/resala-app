openapi: 3.0.3
info:
  title: Resala - OpenAPI
  description: |-
    This is a sample Resala Store Server based on the OpenAPI 3.0 specification.
  version: 1.0.0
servers:
  - url: https://resala-app.onrender.com
    description: Live Server
  - url: http://localhost:5000
    description: Local Server
tags:
  - name: healthz
    description: Check server health!
  - name: auth
    description: User authentication
  - name: user
    description: Operations about user
  - name: address
    description: Operations about address
  - name: category
    description: Operations about category
  - name: product
    description: Operations about products
  - name: stock
    description: Operations about stock (product sku)
  - name: color
    description: Operations about color (product metadata)
  - name: size
    description: Operations about size (product metadata)
  - name: shopping
    description: Operations about shopping

paths:
  /api/v1/healthz:
    get:
      summary: returns OK 🤞
      description: Makes sure server is up and running
      security: []
      tags:
        - healthz
      responses:
        '200':
          description: OK
        '500':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/login:
    post:
      summary: login to the system
      description: login to the system with `email`/`phone` and `password`
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sign
                - password
              properties:
                sign:
                  oneOf:
                    - $ref: '#/components/schemas/User/properties/email'
                    - $ref: '#/components/schemas/User/properties/phone'
                password:
                  $ref: '#/components/schemas/User/properties/password'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - auth
  /api/v1/auth/register:
    post:
      summary: register a new customer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
              properties:
                email:
                  $ref: '#/components/schemas/User/properties/email'
                password:
                  $ref: '#/components/schemas/User/properties/password'
                firstName:
                  $ref: '#/components/schemas/User/properties/firstName'
                lastName:
                  $ref: '#/components/schemas/User/properties/lastName'
      responses:
        '201':
          description: Created. _Customer registered successfully_
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - auth
  /api/v1/auth/forgot-password:
    post:
      summary: send reset code to the user mailbox
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  $ref: '#/components/schemas/User/properties/email'
      responses:
        '200':
          description: Ok. _Reset Code sent to your email_
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - auth
  /api/v1/auth/reset-password:
    post:
      summary: reset user password
      description: You must provide Auth token provided on `forgotPassword` call
      security:
        - bearerReset: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
                - password
              properties:
                email:
                  $ref: '#/components/schemas/User/properties/email'
                password:
                  $ref: '#/components/schemas/User/properties/password'
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: 'ABC123'
      responses:
        '200':
          description: Ok. _User's passwored reseted successfully_
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - auth
  /verify-email.html:
    get:
      summary: verifies user's email
      security: []
      parameters:
        - in: query
          name: email
          schema:
            type: string
            format: email
            example: 'example@mail.com'
          required: true
        - in: query
          name: token
          schema:
            type: string
            format: JWT
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'
          required: true
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - auth
  /api/v1/auth/verify-email:
    post:
      summary: verify user's email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  $ref: '#/components/schemas/User/properties/email'
                token:
                  type: string
                  format: JWT
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'
              required:
                - email
                - token
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - auth
  /api/v1/auth/change-password:
    patch:
      summary: change user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword:
                  $ref: '#/components/schemas/User/properties/password'
                newPassword:
                  $ref: '#/components/schemas/User/properties/password'
              required:
                - oldPassword
                - newPassword
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - auth
  /api/v1/auth/resend-email-verification:
    get:
      summary: resend verification email to user again
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - auth

components:
  schemas:
    User:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        id:
          type: integer
          format: int32
          example: 1
        email:
          type: string
          format: email
          example: hossam@email.com
          minLength: 5
          maxLength: 128
        firstName:
          type: string
          example: Taha
          minLength: 2
          maxLength: 50
        lastName:
          type: string
          example: Hossam
          minLength: 2
          maxLength: 50
        password:
          type: string
          format: password
          example: 'abc@ABC123'
          minLength: 8
          maxLength: 50
        phone:
          type: string
          example: '0150000000'
          minLength: 11
          maxLength: 11
          nullable: true
        role:
          type: string
          format: enum
          default: CUSTOMER
          enum:
            - ADMIN
            - MODERATOR
            - CUSTOMER
        isVerified:
          type: boolean
          default: false
          description: Email verification status.
        lastLogin:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          description: 'Soft delete timestamp (null if not deleted), also used for account deactivation.'
      xml:
        name: user
    Address:
      type: object
      required:
        - state
        - city
        - street
      properties:
        id:
          type: integer
          format: int32
          example: 1
        country:
          type: string
          maxLength: 50
          default: 'Egypt'
        state:
          type: string
          maxLength: 50
          example: 'Giza'
        city:
          type: string
          maxLength: 50
          example: '6th of October'
        street:
          type: string
          maxLength: 100
          example: '6th district'
        building:
          type: string
          maxLength: 50
          example: '2 ب'
          nullable: true
        floor:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          nullable: true
          example: '1'
        note:
          type: string
          nullable: true
          maxLength: 200
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      xml:
        name: address
    Category:
      type: object
      required:
        - arName
        - enName
      properties:
        id:
          type: integer
          format: int32
        categoryId:
          type: integer
          format: int32
          description: 'Uses to create subcategories (hierarchical structure)'
        arName:
          type: string
        enName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          description: 'Soft delete timestamp (null if not deleted), also used for deactivation.'
      xml:
        name: category
    Product:
      type: object
      required:
        - arName
        - enName
        - arDescription
        - enDescription
        - price
      properties:
        id:
          type: integer
          format: int32
        categoryId:
          type: integer
          format: int32
        arName:
          type: string
          maxLength: 100
        enName:
          type: string
          maxLength: 100
        arDescription:
          type: string
          maxLength: 1000
        enDescription:
          type: string
          maxLength: 1000
        price:
          type: number
          format: double
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          description: 'Soft delete timestamp (null if not deleted), also used for deactivation'
      xml:
        name: product
    ProductImage:
      type: object
      properties:
        id:
          type: integer
          format: int32
        productId:
          type: integer
          format: int32
        imageUrl:
          type: string
        createdAt:
          type: string
          format: date-time
      xml:
        name: product_image
    Stock:
      required:
        - productId
        - colorId
        - sizeId
        - quantity
      type: object
      properties:
        id:
          type: integer
          format: int32
        productId:
          type: integer
          format: int32
        colorId:
          type: integer
          format: int32
        sizeId:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      xml:
        name: stock
    Color:
      type: object
      required:
        - code
        - arName
        - enName
      properties:
        id:
          type: integer
          format: int32
        code:
          type: string
          description: 'HEX definition of the color. Must start with `#`'
          example: '#ffffff'
          minLength: 7
          maxLength: 7
        arName:
          type: string
          description: 'Color name in Arabic'
          example: 'أبيض'
        enName:
          type: string
          description: 'Color name in English'
          example: 'White'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      xml:
        name: color
    Size:
      type: object
      required:
        - name
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 5
          example: 'XXL'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      xml:
        name: size
    Cart:
      type: object
      required:
        - userId
        - stockId
        - quantity
      properties:
        userId:
          type: integer
          format: int32
        stockId:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Wishlist:
      type: object
      required:
        - userId
        - productId
      properties:
        userId:
          type: integer
          format: int32
        productId:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Order:
      type: object
      required:
        - userId
      properties:
        id:
          type: integer
          format: int32
        userId:
          type: integer
          format: int32
        subtotal:
          type: number
          format: double
        discount:
          type: number
          format: double
        total:
          type: number
          format: double
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - CANCELLED
        note:
          type: string
          maxLength: 250
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      xml:
        name: order
    OrderItem:
      type: object
      required:
        - orderId
        - name
        - color
        - size
        - quantity
        - price
      properties:
        orderId:
          type: integer
          format: int32
        name:
          type: string
          example: 'عباية مصرى'
        color:
          type: string
          example: 'أسود'
        size:
          type: string
          example: 'XL'
        quantity:
          type: integer
          format: int32
          example: 2
        price:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Shipping:
      type: object
      required:
        - orderId
        - addressId
        - cost
        - phone
        - status
      properties:
        orderId:
          type: integer
          format: int
        addressId:
          type: integer
          format: int32
        cost:
          type: number
          format: double
        phone:
          type: string
          minLength: 11
          maxLength: 11
        status:
          type: string
          enum:
            - PICKED_UP
            - PROCESSING
            - OUT_FOR_DELIVERY
            - DELIVERED
            - CANCELLED
        note:
          type: string
          maxLength: 250
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Payment:
      type: object
      required:
        - orderId
        - method
        - amount
        - status
      properties:
        id:
          type: integer
          format: int32
        orderId:
          type: integer
          format: int32
        method:
          type: string
          maxLength: 15
        amount:
          type: number
          format: double
        status:
          type: string
          enum:
            - PENDING
            - PAID
            - REFUNDED
        note:
          type: string
          maxLength: 250
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Review:
      type: object
      required:
        - userId
        - productId
        - rating
        - comment
      properties:
        id:
          type: integer
          format: int32
        userId:
          type: integer
          format: int32
        productId:
          type: integer
          format: int32
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 250
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Notification:
      type: object
      properties:
        id:
          type: integer
          format: int32
        userId:
          type: integer
          format: int32
        title:
          type: string
          maxLength: 25
        content:
          type: string
          maxLength: 250
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
          description: 'Successful operation indicator'
        data:
          type: object
          description: 'Will contain the data returned by the operation'
      required:
        - success
        - data
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
          description: 'Failed operation indicator'
        message:
          type: string
          description: 'Will contain an error message returned by the operation'
      required:
        - success
        - message
  responses:
    BadRequest:
      description: Invalid/Missing required fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Bad/Invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: User doesn't have permisions to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The specified resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: Something went wrong on the server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth: # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT # optional, arbitrary value for documentation purposes
      description: JWT authorization header using the Bearer scheme. Example Bearer {token}.
    bearerReset: # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT # optional, arbitrary value for documentation purposes
      description: JWT authorization header using the Bearer scheme. Example Bearer {token}.
# Apply the security globally to all operations
security:
  - bearerAuth: [] # use the same name as above
