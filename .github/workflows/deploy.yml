name: Deploy to AWS EC2

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          docker build -t hossam7amdy/resala-server:${{ github.sha }} . -f Dockerfile.server
          docker push hossam7amdy/resala-server:${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Delete old container and prune images
        run: |
          docker stop resala-server || true
          docker rm resala-server || true
          docker image prune -f --filter "until=24h" || true
      - name: Pull image from docker hub
        run: |
          docker pull hossam7amdy/resala-server:${{ github.sha }}
      - name: Run new container
        run: |
          docker run --env-file /home/ec2-user/secrets/.env -d --restart unless-stopped -p 80:80 --name resala-server hossam7amdy/resala-server:${{ github.sha }}
