name: Deploy to AWS EC2

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          docker build -t hossam7amdy/resala-server${{ github.sha }} . -f Dockerfile.server
          docker push hossam7amdy/resala-server:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS EC2
        run: |
          # Use AWS CLI or scripts to update your EC2 service (like using ECS or just a simple SSH command to pull the latest Docker image and restart the service)
          ssh -o StrictHostKeyChecking=no ec2-user@ec2-16-170-205-145.eu-north-1.compute.amazonaws.com "docker pull hossam7amdy/resala-server:${{ github.sha }} && docker run --env-file .env -d -p 80:80 hossam7amdy/resala-server:${{ github.sha }}"
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
