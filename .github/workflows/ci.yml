name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: yarn install
        run: |
          yarn
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  
      - name: Use Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
        
      - name: yarn format and lint
        run: |
          yarn
          yarn lint:check
          yarn format:check
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up test environment variables
        run: echo "${{ secrets.ENV_TEST_VARS }}" > .env.test
      - name: Use Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: yarn install and test
        run: |
          yarn
          yarn test
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: yarn install and build
        run: |
          yarn
          yarn build
