name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      PORT: 5000
      JWT_SECRET: access_secret
      JWT_REFRESH: refresh_secret
      JWT_RESET: reset_secret
      JWT_VERIFY: verify_secret
      SERVER_URL: http://localhost:5000
      DATABASE_URL: mysql://root:root@localhost:3306/root
      TWILIO_ACCOUNT_SID: AC_account_sid
      TWILIO_AUTH_TOKEN: twilio_auth_token
      TWILIO_PHONE_NUMBER: +phone_number
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASS: ${{ secrets.MAIL_PASS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Use Envs
        run: |
          echo "MAIL_USER=$MAIL_USER" >> .env
          echo "MAIL_PASS=$MAIL_PASS" >> .env

      - name: npm install, build, and test
        run: |
          npm ci
          npm run build
          npm run test

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: npm install and lint
        run: |
          npm ci
          npm run lint
