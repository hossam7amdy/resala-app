name: Node.js CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgress
    env:
      JWT_SECRET: secret
      DATABASE_URL: postgresql://postgres:postgress@localhost:5432/testdb
      PORT: 5000
      SERVER_URL: localhost:5000
      MAIL_USER: test@mail.com
      MAIL_PASS: testpass
      AZURE_STORAGE_NAME: dummy
      AZURE_CDN_ENDPOINT: dummy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run install:shared
          npm run install:server
          npm run migrate:prisma
          npm run test:server --if-present
          npm run build:server --if-present

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: npm install and lint
        run: |
          npm install
          npm run lint
