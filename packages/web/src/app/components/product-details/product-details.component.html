<section *ngIf="productDetails && productImages" class="product-details">
  <div class="container">
    <div class="row img-product">
      <div class="col-md-9 main-img">
        <owl-carousel-o [options]="productDetailsOption">
          <ng-container *ngFor="let product of productImages">
            <ng-template carouselSlide>
              <div class="main-img">
                <img [src]="product.imageUrl" class="w-100 image-products" [alt]="product.id"
                  [title]="product.enName" />
              </div>
            </ng-template>
          </ng-container>
        </owl-carousel-o>

        <owl-carousel-o [options]="miniImgCarousel">
          <ng-container *ngFor="let product of productImages">
            <ng-template carouselSlide [id]="product.id">
              <div class="img-content">
                <img [src]="product.imageUrl" class="w-100 image-products" [alt]="product.id"
                  [title]="product.enName" />
              </div>
            </ng-template>
          </ng-container>
        </owl-carousel-o>
      </div>
      <div class="col-md-3">
        <h2 class="h2">{{ productDetails.enName }}</h2>
        <p class="p">{{ productDetails.enDescription }}</p>
        <span class="price">{{ productDetails.price }}<label class="currency"> EGP</label></span>
        <span class="sub-text">Tax included. Shipping calculated at checkout.</span>

        <h3 class="h4">Color</h3>
        <div class="d-flex flex-wrap color-options-list">
          <ng-container *ngFor="let product of productStockColor">
            <div [ngClass]="{ active: currentColor === product?.color?.id }" class="color-option">
              <input [(ngModel)]="selectedColor" type="radio" class="btn-check" name="color-option" id="btncolor"
                [value]="selectedColor" />
              <label (click)="[onColorChange(product),isChooseColorFun()]" for="btncolor">
                {{ product.color.enName }}
              </label>

            </div>
          </ng-container>
        </div>

        <!-- <div class="row">
          <div *ngFor="let colors of productStock" class="btn-group color col-md-4" role="group"
            aria-label="Basic radio toggle button group">

            <input type="radio" class="btn-check" name="color-option" [id]="colors.color.colorId" autocomplete="off"
              [value]="colors.color.code" />
            <label class="btn color-btn" [for]="colors.color.colorId">{{colors.color.enName }}</label>
            <p>{{selectedColor}}</p>
           

          </div>
        </div>
         -->
        <!-- [ngStyle]="{'background-color':colors.color.code}" -->

        <h3 class="h4">Size</h3>
        <div class="d-flex flex-wrap size-options-list">
          <ng-container *ngFor="let product of productStock">
            <div [ngClass]="{ active: currentSize === product?.size?.id }" class="size-option">
              <input [(ngModel)]="selectedSize" type="radio" class="btn-check" name="size-option" id="btnsize"
                [value]="selectedSize" />
              <label *ngIf="currentColor == product.colorId" (click)="[onSizeChange(product),isChooseSizeFun()]"
                for="btnsize">
                {{ product.size.name }}
              </label>

            </div>
          </ng-container>
        </div>
        <!-- <div class="row">
          <div *ngFor="let productSize of productStock " class="size col-md-4 btn-group" role="group"
            aria-label="Basic radio toggle button group"> -->

        <!-- aria-label="Basic radio toggle button group">
          btn-group , -->

        <!-- <input [(ngModel)]="selectedSize" type="radio" class="btn-check" name="size-option" id="btnsize1"
              autocomplete="off" [value]="selectedSize" />
            <label (click)="onSizeChange(productSize.size.name)" class="btn color-btn"
              for="btnsize1">{{productSize.size.name}}</label> -->

        <!-- <button [(ngModel)]="selectedSize" [value]="selectedSize" [ngClass]="statusClassSizeBtn"
            (click)="setActiveClass()" [ngStyle]="">{{productSize.size.name}}</button> -->
        <!-- 
            <p>{{selectedSize}}</p>
          </div>
        </div> -->

        <h4 class="h4">Quantity</h4>
        <section class="quantity">
          <div class="counter">
            <button class="min-counter-btn" (click)="minCounterQuantity()">
              <i class="fa-solid fa-minus"></i>
            </button>
            <input class="counter-text" type="number" [value]="counterQuantity" disabled min="1" data-min="1" />
            <button class="plus-counter-btn" (click)="plusCounterQuantity()">
              <i class="fa-solid fa-plus"></i>
            </button>

          </div>
        </section>

        <div class="add-cart-btn">
          <button (click)="addProduct(stockIdSize, counterQuantity)" class="w-100">ADD TO CART</button>


        </div>
      </div>
    </div>
  </div>
</section>
