<div
  #topBar
  id="carouselExampleControls"
  class="row carousel slide top-bar fixed-top"
  data-bs-ride="carousel"
>
  <owl-carousel-o [options]="topBarSlide">
    <ng-template carouselSlide>
      <p class="promo-text">
        <i class="fas fa-gift mx-2 promo"></i>{{ 'top-bar.firstOffer' | translate }}
      </p>
    </ng-template>
    <ng-template carouselSlide>
      <p class="promo-text">
        <i class="fas fa-gift mx-2 promo"></i>{{ 'top-bar.secondOffer' | translate }}
      </p>
    </ng-template>
    <ng-template carouselSlide>
      <p class="promo-text">
        <i class="fas fa-gift mx-2 promo"></i>{{ 'top-bar.thirdOffer' | translate }}
      </p>
    </ng-template>
  </owl-carousel-o>

  <!-- <div class="social-icon">
    <i class="fab fa-whatsapp mx-3 col"></i>
    <i class="fab fab fa-facebook mx-3"></i>
    <i class="fab fab fa-instagram mx-3"></i>
  </div> -->

  <button
    class="carousel-control-prev"
    type="button"
    data-bs-target="#carouselExampleControls"
    data-bs-slide="prev"
  >
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button
    class="carousel-control-next"
    type="button"
    data-bs-target="#carouselExampleControls"
    data-bs-slide="next"
  >
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
