<section *ngIf="orderStatus == 'true'" class="">
    <h1 class="h1">The Order Successfuly</h1>
    <div class="container text-center">
        <div>
            <img src="./assets/products/confirm order.jpg" alt="" class="w-50 mx-auto">
        </div>
        <div class="w-25 mx-auto">
            <button class="custome-btn" routerLink="/home">Go shoping</button>
        </div>    
    </div>
</section>


<section *ngIf="orderStatus == 'false' ||orderStatus == '' " class="">
    
    <div class="container text-center">
        <div>
            <img src="./assets/products/payment_fail_icon-300x300.png" alt="" class="w-25 mx-auto">
            <h1 class="h1 mt-0">Payment Failed</h1>
            <p class="p py-0">Your payment transaction has been declined. Kindly contact your bank for further assistance or try again.</p>
        </div>
        <div class="w-25 mx-auto">
            
            <button class="custome-btn" routerLink="/home" >Go shoping</button>
        </div>  
    </div>
</section>
