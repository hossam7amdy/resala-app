<div class="profile">
  <section *ngIf="userInfo != {}" class="w-25 mx-auto shadow rounded p-4 my-1 bg-main-ligh">
    <h1 class="my-3">{{ 'profile.mainTitle' | translate }}</h1>
    <form class="form">
      <fieldset disabled>
        <div class="form-item">
          <label for="firstName">{{ 'profile.firstName' | translate }}</label>
          <input
            type="text"
            formControlName="firstName"
            class="form-control"
            id="firstName"
            [value]="userInfo.firstName"
          />
        </div>

        <div class="form-item">
          <label for="lastName">{{ 'profile.lastName' | translate }}</label>
          <input
            type="text"
            formControlName="lastName"
            class="form-control"
            id="lastName"
            [value]="userInfo.lastName"
          />
        </div>

        <div class="form-item">
          <label for="email">{{ 'profile.email' | translate }}</label>
          <input
            type="email"
            formControlName="email"
            class="form-control"
            id="email"
            [value]="userInfo.email"
          />
        </div>

        <div class="form-item">
          <label for="phone">{{ 'profile.phone' | translate }}</label>
          <input
            type="text"
            formControlName="phone"
            class="form-control"
            id="phone"
            [value]="userInfo.phone"
          />
        </div>
      </fieldset>
      <button routerLink="/home" type="button" class="custome-btn mt-3">
        {{ 'profile.shoppingBtn' | translate }} <i class="fa-solid fa-bag-shopping"></i>
      </button>
    </form>
  </section>
</div>
