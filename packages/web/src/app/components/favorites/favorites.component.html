<section *ngIf="myProducts.length != 0; else emptyCart">
  <div class="container-fluid">
    <h1 class="h2">My Favourites Products</h1>
    <div class="my-products row justify-content-center text-center">
      <div
        *ngFor="let product of myProducts"
        class="product mx-2 mb-3 px-0 col-xs-12 col-sm-4 col-md-3 col-lg-3 col-xl-2 justify-content-center text-center"
      >
        <div class="parent-img-content">
          <header [ngClass]="" class="header-product">
            <!-- (click)="removeFavoriteIcon(favoritIcon)" -->
            <i
              (click)="removeFavoriteIcon(product.product.id)"
              data-bs-toggle="modal"
              data-bs-target="#exampleModal"
              class="fa-regular fa-heart favourit-icon"
            ></i>

            <!-- Modal -->
            <div
              class="modal fade"
              id="exampleModal"
              tabindex="-1"
              aria-labelledby="exampleModalLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Confirm Delete</h5>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>
                  <div class="modal-body">
                    Do You Want Delete This Product From Your Favorite List ?
                  </div>
                  <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                      Cancel
                    </button>
                    <button
                      type="button"
                      class="btn btn-secondary"
                      data-bs-dismiss="modal"
                      (click)="deletePoductInWishList()"
                    >
                      Yes
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <!--end checked delete all items -->
          </header>
          <div
            class="img-content"
            [routerLink]="['/product-details/', product.product.id]"
            role="button"
          >
            <p class="offer">discount<span> 20%</span></p>

            <img
              class="w-100 image-products"
              [src]="product.product.imageUrl"
              [alt]="product.product.enName"
              [title]="product.product.enName"
            />
          </div>
          <footer class="footer-product" [routerLink]="['/product-details/', product.product.id]">
            <i class="fa-solid fa-bag-shopping shopping-icon"></i>
          </footer>
        </div>

        <div class="descrp">
          <h6 [routerLink]="['/product-details/', product.product.id]" class="mb-0" role="button">
            {{ product.product.enName }}
          </h6>

          <div class="rating">
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<ng-template class="m-auto" #emptyCart>
  <div class="emptyCartParent">
    <i class="fa-regular fa-heart favourit-icon"></i>
    <h1 class="emptyCart text-uppercase">Your Favourites List Is Empty ...</h1>
  </div>
</ng-template>
