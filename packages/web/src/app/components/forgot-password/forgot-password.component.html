<div>
    <section class="w-25 mx-auto shadow rounded p-4 my-1 bg-main-ligh">
        <h1 class="my-3">Forgot Password</h1>
        <form action="" [formGroup]="forgotPw" class="form">
            <!--start select Box -->
            <div class="form-check form-check-inline">
                <input checked (click)="spinnerLoadEmail()" class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
                <label class="form-check-label" for="inlineRadio1">Email</label>
              </div>
              <div class="form-check form-check-inline">
                <input (click)="spinnerLoadPhone()" class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
                <label class="form-check-label" for="inlineRadio2">Mobile</label>
              </div>
              
            <!--end select Box -->



            <div *ngIf="isEmail" class="form-item">
          
                <input
                  type="text"
                  formControlName="email"
                  class="form-control"
                  id="email"
                  placeholder="Email"
                />
            </div>

            <div *ngIf="isPhone" class="form-item">
          
                <input
                  type="phone"
                  
                  class="form-control"
                  id="phone"
                  placeholder="Phone"
                />
            </div>



            <button [disabled]="forgotPw.invalid" type="submit" class="custome-btn mt-3" (click)="sendEmail()">
                Verify Email
                <span *ngIf="isLoading"><i class="fa-spin fas fa-spinner"></i></span>
              </button>
          
              <p *ngIf="successMsg" class="alert text-green mx-auto">{{ successMsg }}</p>
              <p *ngIf="errMsg" class="alert text-danger mx-auto">{{ errMsg }}</p>
        </form> 
    </section>
</div>
