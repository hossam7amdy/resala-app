<section>
  <div class="overlay" *ngIf="onClick">
    <div class="overlay-section row">
      <i class="fa-solid fa-circle-xmark close" (click)="closeOverlay()"></i>
      <div class="col-4 left-overlay">
        <h3>Style</h3>
        <p>Simple style</p>
        <h1>Get</h1>
        <h1>This</h1>
        <h1>One!</h1>
      </div>
      <div class="col-md-8 img-overlay">
        <img src="./assets/products/nekab.jpeg" alt="" />
      </div>
    </div>
  </div>
</section>

<!-- section slider  -->

<section class="slider">
  <owl-carousel-o [options]="mainSliderOptions" class="custom-owl">
    <ng-template carouselSlide>
      <div class="row vh-100 half-slide">
        <div class="col-6">
          <img src="./assets/main-slider/WhatsApp1.jpg" class="w-100" alt="Slide1" />
        </div>
        <div class="col-6 right-content">
          <div class="title-content">
            <h1>Resala</h1>
            <p>The Best Collection For Veiled Ladies</p>
          </div>
        </div>
      </div>
    </ng-template>
    <ng-template carouselSlide
      ><img class="vh-100 w-100" src="./assets/main-slider/2.jpg" alt="Slide2"
    /></ng-template>
    <ng-template carouselSlide
      ><img class="vh-100 w-100" src="./assets/main-slider/3.jpg" alt="Slide3"
    /></ng-template>
  </owl-carousel-o>
</section>

<!-- trends -->
<section class="trends">
  <div class="content">
    <div class="trends-title">
      <h2 class="h1">Trends Products</h2>
    </div>
    <owl-carousel-o [options]="trendsSliderOptions">
      <ng-template carouselSlide>
        <div class="row w-100 justify-content-center text-center" style="height: 600px">
          <div class="col-4 trends-slide">
            <a>
              <i class="fa-regular fa-heart favourit-icon"></i>
              <img src="./assets/main-slider/WhatsApp1.jpg" alt="trends" class="img-trend" />
              <i class="fa-solid fa-bag-shopping shopping-icon"></i>
            </a>
          </div>
          <div class="col-4 trends-slide">
            <a>
              <i class="fa-regular fa-heart favourit-icon"></i>
              <img src="./assets/products/1.jpg" alt="trends" class="img-trend" />
              <i class="fa-solid fa-bag-shopping shopping-icon"></i>
            </a>
          </div>
        </div>
      </ng-template>
      <ng-template carouselSlide>
        <div class="row w-100 justify-content-center text-center" style="height: 600px">
          <div class="col-4 trends-slide">
            <a href="#">
              <i class="fa-regular fa-heart favourit-icon"></i>
              <img src="./assets/products/5.jpg" alt="trends" class="img-trend" />
              <i class="fa-solid fa-bag-shopping shopping-icon"></i>
            </a>
          </div>
          <div class="col-4 trends-slide">
            <a href="#">
              <i class="fa-regular fa-heart favourit-icon"></i>
              <img src="./assets/main-slider/WhatsApp2.jpg" alt="trends" class="img-trend" />
              <i class="fa-solid fa-bag-shopping shopping-icon"></i>
            </a>
          </div>
        </div>
      </ng-template>
    </owl-carousel-o>
  </div>
</section>

<!-- section products -->
<div
  *ngIf="products.length < 1"
  class="spinner-border text-warning justify-content-center text-center"
  style="width: 3rem; height: 3rem; top: 50px"
  role="status"
>
  <span class="visually-hidden">Loading...</span>
</div>
<section *ngIf="products.length > 0" class="">
  <div class="container-fluid">
    <h2 class="h1">Pobular Products</h2>

    <div class="row justify-content-center text-center">
      <div
        *ngFor="let product of products "
        class="mx-2 mb-3 px-0 col-xs-12 col-sm-4 col-md-3 col-lg-3 col-xl-2 justify-content-center text-center"
      >

      <!-- | paginate: { id: 'paginationTool',
        itemsPerPage: pageLimit,
        currentPage: currentPage,
        totalItems: totalItems }" -->

        <div>
          <!-- *ngIf="product.images.length !== 0" -->
          <!-- <p>{{product.category.enName}}</p>     -->

          <!-- <div *ngIf="product.images.length == 0">
                    <div class="img-content">
                        <i class="fa-regular fa-heart favourit-icon"></i>
                        <img class="w-100 image-products" src="./assets/main-slider/WhatsApp1.jpg"
                            [alt]="product.enName" [title]="product.enName">
                        <i class="fa-solid fa-bag-shopping shopping-icon"></i>

                    </div>
                </div> -->
          <!-- *ngFor="let image of product.images"  -->
          <div class="parent-img-content">
            <!-- currentProduct === product?.id -->
            <header class="header-product">
              <i
                (click)="addPoductInWishList(product.id, favoritIcon)"
                #favoritIcon
                class="fa-regular fa-heart favourit-icon"
              ></i>
            </header>
            <div class="img-content" [routerLink]="['/product-details/', product.id]" role="button">
              <p class="offer">discount<span> 20%</span></p>

              <img
                class="w-100 image-products"
                [src]="product.imageUrl"
                [alt]="product.enName"
                [title]="product.enName"
              />
            </div>
            <footer class="footer-product" [routerLink]="['/product-details/', product.id]">
              <i class="fa-solid fa-bag-shopping shopping-icon"></i>
            </footer>
          </div>
          <!--  -->
          <div class="descrp">
            <h6 [routerLink]="['/product-details/', product.id]" class="mb-0" role="button">
              {{ product.enName }}
            </h6>

            <div class="rating">
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
            </div>
            <span class="price">{{ product.price }}<label class="currency"> EGP</label></span>
          </div>
        </div>
      </div>
    </div>

    <div class="container-fluid">
      <h2 class="h1">All Categories</h2>

      <owl-carousel-o
        [options]="pobularProducts"
        class="justify-content-center text-center product"
      >
        <ng-container *ngFor="let product of products">
          <ng-template carouselSlide>
            <!-- *ngIf="product.images.length !== 0" -->
            <div class="parent-img-content px-2">
              <header [ngClass]="" class="header-product">
                <i
                  (click)="addPoductInWishList(product.id, favoritIcon)"
                  #favoritIcon
                  class="fa-regular fa-heart favourit-icon"
                ></i>
              </header>

              <div
                class="img-content"
                [routerLink]="['/product-details/', product.id]"
                role="button"
              >
                <p class="offer">discount<span> 20%</span></p>

                <img
                  class="w-100 image-products"
                  [src]="product.imageUrl"
                  [alt]="product.enName"
                  [title]="product.enName"
                />
              </div>

              <footer class="footer-product" [routerLink]="['/product-details/', product.id]">
                <i class="fa-solid fa-bag-shopping shopping-icon"></i>
              </footer>
            </div>

            <div class="descrp px-2">
              <h6 [routerLink]="['/product-details/', product.id]" class="mb-0" role="button">
                {{ product.enName }}
              </h6>
              <span class="price">{{ product.price }}<label class="currency"> EGP</label></span>
              <div class="rating">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
              </div>
            </div>
          </ng-template>
        </ng-container>
      </owl-carousel-o>
    </div>
  </div>


  <!-- <pagination-controls  id="paginationTool"
                      (pageChange)="pageChanged($event)"
                      (pageBoundsCorrection)="pageChanged($event)"
                      [maxSize]="9"
                      [directionLinks]="true"
                      [autoHide]="true"

                      previousLabel="Previous"
                      nextLabel="Next"
                      screenReaderPaginationLabel="Pagination"
                      screenReaderPageLabel="page"
                      screenReaderCurrentLabel="You're on page">
</pagination-controls> -->
</section>
