<app-spinner [customSpinIsLoading]="customSpinIsLoading"></app-spinner>

<section *ngIf="!customSpinIsLoading && allProductsCategory">
  <div class="container-fluid">
    <h1 class="h1">{{ _Translate.currentLang == 'ar' ? arTitleCategory : titleCategory }}</h1>
    <div class="row justify-content-center text-center">
      <div
        *ngFor="
          let products of allProductsCategory
            | paginate
              : {
                  id: 'paginationTool',
                  itemsPerPage: pageLimit,
                  currentPage: currentPage,
                  totalItems: totalItems,
                }
        "
        class="mx-2 mb-3 px-0 col-xs-6-custome col-sm-4 col-md-3 col-lg-3 col-xl-2 justify-content-center text-center"
      >
        <div>
          <div class="parent-img-content">
            <header class="header-product">
              <i
                (click)="addPoductInWishList(products.id, favoritIcon)"
                #favoritIcon
                class="fa-regular fa-heart favourit-icon"
              ></i>
            </header>
            <div
              class="img-content"
              [routerLink]="['/product-details/', products.id]"
              role="button"
            >
              <div *ngFor="let discount of products.discounts">
                <p *ngIf="discount.type == 'PERCENTAGE' && discount.isActive == true" class="offer">
                  {{ 'home.allProducts.sale' | translate }}
                  <span> {{ discount.amount }}%</span>
                </p>
              </div>

              <img
                class="w-100 image-products"
                [src]="products.imageUrl"
                [alt]="_Translate.currentLang == 'ar' ? products.arName : products.enName"
                [title]="_Translate.currentLang == 'ar' ? products.arName : products.enName"
              />
            </div>
            <footer class="footer-product" [routerLink]="['/product-details/', products.id]">
              <i [lang]="_Translate.currentLang" class="fa-solid fa-bag-shopping shopping-icon"></i>
            </footer>
          </div>
          <!--  -->
          <div class="descrp">
            <h6
              [routerLink]="['/product-details/', products.id]"
              [lang]="_Translate.currentLang"
              class="mb-0"
              role="button"
            >
              {{ _Translate.currentLang === 'ar' ? products.arName : products.enName }}
            </h6>

            <ngx-stars-rating
              [rate]="products.avgRating"
              [options]="ratingOptions"
              [starTemplate]="starCustomTemplate"
            ></ngx-stars-rating>

            <div class="rating">
              <ng-template #starCustomTemplate>
                <span
                  *ngIf="products.avgRating !== 0"
                  class="material-symbols-outlined"
                  style="font-size: 15px"
                  ><i class="fa-solid fa-star"></i
                ></span>
              </ng-template>
            </div>

            <span class="price" [lang]="_Translate.currentLang"
              >{{ products.price }}
              <label class="currency"> {{ 'home.allProducts.currency' | translate }}</label></span
            >
          </div>
        </div>
      </div>
      <div class="mt-5">
        <pagination-controls
          id="paginationTool"
          (pageChange)="pageChanged($event)"
          (pageBoundsCorrection)="pageChanged($event)"
          [maxSize]="9"
          [directionLinks]="true"
          [autoHide]="false"
          [responsive]="true"
          previousLabel="{{ 'home.allProducts.previousLabel' | translate }}"
          nextLabel="{{ 'home.allProducts.nextLabel' | translate }}"
          screenReaderPaginationLabel="Pagination"
          screenReaderPageLabel="page"
          screenReaderCurrentLabel="You're on page"
        >
        </pagination-controls>
      </div>
    </div>
  </div>
</section>
