<app-spinner [customSpinIsLoading]="authenticator.isPending"></app-spinner>

<amplify-authenticator
  [loginMechanisms]="['email']"
  [socialProviders]="['google']"
  [signUpAttributes]="['email', 'family_name', 'given_name', 'phone_number']"
  [formFields]="formFields"
  [initialState]="'signIn'"
  [services]="services"
  [hideSignUp]="false"
>
  <ng-template amplifySlot="header">
    <div style="padding: var(--amplify-space-large); text-align: center">
      <!-- <img class="amplify-image" alt="Amplify logo" src="assets/logo/logo.png" style="width: 150px;" /> -->
    </div>
  </ng-template>

  <ng-template amplifySlot="confirm-sign-up-header">
    <img class="amplify-image" alt="Amplify logo" src="assets/logo/logo.png" style="width: 150px" />
  </ng-template>

  <ng-template amplifySlot="setup-totp-header">
    <div style="padding: var(--amplify-space-large); text-align: center">
      <img
        class="amplify-image"
        alt="Amplify logo"
        src="assets/logo/logo.png"
        style="width: 150px"
      />
    </div>
  </ng-template>

  <ng-template amplifySlot="confirm-sign-in-header">
    <div style="padding: var(--amplify-space-large); text-align: center">
      <img
        class="amplify-image"
        alt="Amplify logo"
        src="assets/logo/logo.png"
        style="width: 150px"
      />
    </div>
  </ng-template>

  <ng-template amplifySlot="forgot-password-header">
    <div style="padding: var(--amplify-space-large); text-align: center">
      <img
        class="amplify-image"
        alt="Amplify logo"
        src="assets/logo/logo.png"
        style="width: 150px"
      />
    </div>
  </ng-template>

  <ng-template amplifySlot="confirm-reset-password-header">
    <div style="padding: var(--amplify-space-large); text-align: center">
      <img
        class="amplify-image"
        alt="Amplify logo"
        src="assets/logo/logo.png"
        style="width: 150px"
      />
    </div>
  </ng-template>

  <ng-template amplifySlot="authenticated" let-user="user">
    <div style="padding: var(--amplify-space-large); text-align: center">
      <img
        class="amplify-image"
        alt="Amplify logo"
        src="assets/logo/logo.png"
        style="width: 150px"
      />
      <h2>Welcome, {{ user.username }}!</h2>
      <button
        routerLink="/home"
        type="button"
        class="custome-btn mt-3"
        style="width: auto; padding: 10px 50px"
      >
        {{ 'profile.shoppingBtn' | translate }} <i class="fa-solid fa-bag-shopping"></i>
      </button>
    </div>
  </ng-template>
</amplify-authenticator>
