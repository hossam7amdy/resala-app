<section>
  <div class="container-fluid">
    <h1 class="h1">{{titleCategory}}</h1>
      <div class="row justify-content-center text-center">
          <div *ngFor="let products of allProductsCategory" class="mx-2 mb-3 px-0 col-xs-12 col-sm-4 col-md-3 col-lg-3 col-xl-2 justify-content-center text-center">
              

              <div>
                <!-- *ngIf="product.images.length !== 0" -->
                <!-- <p>{{product.category.enName}}</p>     -->
      
                <!-- <div *ngIf="product.images.length == 0">
                          <div class="img-content">
                              <i class="fa-regular fa-heart favourit-icon"></i>
                              <img class="w-100 image-products" src="./assets/main-slider/WhatsApp1.jpg"
                                  [alt]="product.enName" [title]="product.enName">
                              <i class="fa-solid fa-bag-shopping shopping-icon"></i>
      
                          </div>
                      </div> -->
                <!-- *ngFor="let image of product.images"  -->
                <div class="parent-img-content">
                  <!-- currentProduct === product?.id -->
                  <header class="header-product">
                    <i
                      (click)="addPoductInWishList(products.id, favoritIcon)"
                      #favoritIcon
                      class="fa-regular fa-heart favourit-icon"
                    ></i>
                  </header>
                  <div class="img-content" [routerLink]="['/product-details/', products.id]" role="button">
                    <p class="offer">discount<span> 20%</span></p>
      
                    <img
                      class="w-100 image-products"
                      [src]="products.imageUrl"
                      [alt]="products.enName"
                      [title]="products.enName"
                    />
                  </div>
                  <footer class="footer-product" [routerLink]="['/product-details/', products.id]">
                    <i class="fa-solid fa-bag-shopping shopping-icon"></i>
                  </footer>
                </div>
                <!--  -->
                <div class="descrp">
                  <h6 [routerLink]="['/product-details/', products.id]" class="mb-0" role="button">
                    {{ products.enName }}
                  </h6>
      
                  <div class="rating">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                  </div>
                  <span class="price">{{ products.price }}<label class="currency"> EGP</label></span>
                </div>
              </div>
          
          </div>
      </div>
  </div>
</section>
