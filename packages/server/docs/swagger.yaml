  /auth/google:
    get:
      operationId: GoogleAuth
      responses:
        '204':
          description: No content
      description: >-
        This endpoint redirects the user to Google's and initiates the Google
        OAuth2 login flow.


        - The `redirectUrl` query parameter should be passed in the request, the
        `redirectUrl` should be a URL encoded.

        - The frontend should implement a route that listens to the
        `redirectUrl` and extracts the `accessToken` and `refreshToken` from the
        query parameters.


        **Example:**


        1. _Request_ - Redirect the user to Google's login page:

        ```ts

        const redirectUrl =
        encodeURIComponent('http://localhost:3000/login/callback');

        window.location.href =
        `http://localhost:3000/auth/google?redirectUrl=${redirectUrl}`;

        ```

        2. _Response_ - Google redirects the user to the `redirectUrl` with the
        tokens as query parameters:

        ```ts

        // http://localhost:3000/login/callback?accessToken=...&refreshToken=...

        ```
      tags:
        - Auth
      security: []
      parameters:
        - description: '- The URL to redirect the user to after the login is successful.'
          in: query
          name: redirectUrl
          required: false
          schema:
            type: string
