openapi: 3.0.0
info:
  title: '@resala/server'
  version: 1.0.0
  description: Resala server
  license:
    name: ISC
  contact:
    name: Hossam Hamdy
paths:
  /api/v1/users/{userId}:
    get:
      operationId: GetUser
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserResponse'
      tags:
        - User
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
    delete:
      operationId: DeleteUser
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'
      tags:
        - User
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
    put:
      operationId: UpdateUser
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'
      tags:
        - User
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                role:
                  type: string
                  enum:
                    - ADMIN
                    - CUSTOMER
                    - MODERATOR
                lastName:
                  type: string
                firstName:
                  type: string
                phone:
                  type: string
                isVerified:
                  type: boolean
              type: object
  /api/v1/users:
    get:
      operationId: ListUsers
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
      tags:
        - User
      security:
        - JWT_SECRET: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            default: 1
            format: int32
            type: integer
        - in: query
          name: limit
          required: false
          schema:
            default: 10
            format: int32
            type: integer
        - in: query
          name: search
          required: false
          schema:
            type: string
  /api/v1/stocks/{stockId}:
    get:
      operationId: Get
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStockResponse'
      tags:
        - Stock
      security: []
      parameters:
        - in: path
          name: stockId
          required: true
          schema:
            type: string
    put:
      operationId: Update
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStockResponse'
      tags:
        - Stock
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: stockId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                quantity:
                  type: integer
                  format: int32
                sizeId:
                  type: integer
                  format: int32
                productId:
                  type: integer
                  format: int32
                colorId:
                  type: integer
                  format: int32
              type: object
    delete:
      operationId: Delete
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteStockResponse'
      tags:
        - Stock
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: stockId
          required: true
          schema:
            type: string
  /api/v1/stocks:
    get:
      operationId: List
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListStocksResponse'
      tags:
        - Stock
      security: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            default: 1
            format: int32
            type: integer
        - in: query
          name: limit
          required: false
          schema:
            default: 10
            format: int32
            type: integer
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: productId
          required: false
          schema:
            format: int32
            type: integer
    post:
      operationId: Create
      responses:
        '201':
          description: Stock created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStockResponse'
      tags:
        - Stock
      security:
        - JWT_SECRET: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                quantity:
                  type: integer
                  format: int32
                sizeId:
                  type: integer
                  format: int32
                productId:
                  type: integer
                  format: int32
                colorId:
                  type: integer
                  format: int32
              type: object
  /api/v1/sizes/{sizeId}:
    get:
      operationId: Get
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSizeResponse'
      tags:
        - Size
      security: []
      parameters:
        - in: path
          name: sizeId
          required: true
          schema:
            type: string
    put:
      operationId: Update
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSizeResponse'
      tags:
        - Size
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: sizeId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
              type: object
    delete:
      operationId: Delete
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSizeResponse'
      tags:
        - Size
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: sizeId
          required: true
          schema:
            type: string
  /api/v1/sizes:
    get:
      operationId: List
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSizesResponse'
      tags:
        - Size
      security: []
      parameters: []
    post:
      operationId: Create
      responses:
        '201':
          description: Size created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSizeResponse'
      tags:
        - Size
      security:
        - JWT_SECRET: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
              type: object
  /api/v1/cart:
    get:
      operationId: GetCart
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCartResponse'
      tags:
        - Shopping
      security:
        - JWT_SECRET: []
      parameters: []
    delete:
      operationId: ClearCart
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCartResponse'
      tags:
        - Shopping
      security:
        - JWT_SECRET: []
      parameters: []
  /api/v1/cart/items:
    post:
      operationId: AddItemToCart
      responses:
        '201':
          description: Item added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCartResponse'
      tags:
        - Shopping
      security:
        - JWT_SECRET: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                stockId:
                  type: integer
                  format: int32
                quantity:
                  type: integer
                  format: int32
              type: object
  /api/v1/cart/items/{stockId}:
    delete:
      operationId: RemoveItemFromCart
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCartResponse'
      tags:
        - Shopping
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: stockId
          required: true
          schema:
            type: string
  /api/v1/wishlist:
    get:
      operationId: GetWishlist
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWishlistResponse'
      tags:
        - Shopping
      security:
        - JWT_SECRET: []
      parameters: []
    delete:
      operationId: ClearWishlist
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWishlistResponse'
      tags:
        - Shopping
      security:
        - JWT_SECRET: []
      parameters: []
  /api/v1/wishlist/items:
    post:
      operationId: AddProductToWishlist
      responses:
        '201':
          description: Item added to wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWishlistResponse'
      tags:
        - Shopping
      security:
        - JWT_SECRET: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                productId:
                  type: integer
                  format: int32
              type: object
  /api/v1/wishlist/items/{productId}:
    delete:
      operationId: RemoveProductFromWishlist
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWishlistResponse'
      tags:
        - Shopping
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
  /api/v1/reviews:
    post:
      operationId: CreateReview
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReviewResponse'
      tags:
        - Review
      security:
        - JWT_SECRET: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                comment:
                  type: string
                rating:
                  type: integer
                  format: int32
                productId:
                  type: integer
                  format: int32
                userId:
                  type: integer
                  format: int32
              type: object
    get:
      operationId: ListReviews
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReviewsResponse'
      tags:
        - Review
      security: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            default: 1
            format: int32
            type: integer
        - in: query
          name: limit
          required: false
          schema:
            default: 10
            format: int32
            type: integer
        - in: query
          name: productId
          required: true
          schema:
            format: int32
            type: integer
  /api/v1/reviews/{reviewId}:
    put:
      operationId: UpdateReview
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateReviewResponse'
      tags:
        - Review
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                comment:
                  type: string
                rating:
                  type: integer
                  format: int32
                productId:
                  type: integer
                  format: int32
                userId:
                  type: integer
                  format: int32
              type: object
    delete:
      operationId: DeleteReview
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteReviewResponse'
      tags:
        - Review
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
        - in: query
          name: userId
          required: false
          schema:
            type: string
    get:
      operationId: GetReview
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReviewResponse'
      tags:
        - Review
      security: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
  /api/v1/products/{productId}:
    get:
      operationId: Get
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProductResponse'
      tags:
        - Product
      security: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
    put:
      operationId: Update
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProductResponse'
      description: Update a product, only admins can update products
      tags:
        - Product
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                categoryId:
                  type: string
                arName:
                  type: string
                enName:
                  type: string
                arDescription:
                  type: string
                enDescription:
                  type: string
                price:
                  type: string
                image:
                  type: string
                  format: binary
              required:
                - categoryId
                - arName
                - enName
                - arDescription
                - enDescription
                - price
    delete:
      operationId: Delete
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProductResponse'
      description: Delete a product, only admins can delete products
      tags:
        - Product
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
  /api/v1/products:
    get:
      operationId: List
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductsResponse'
      tags:
        - Product
      security: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            default: 1
            format: int32
            type: integer
        - in: query
          name: limit
          required: false
          schema:
            default: 10
            format: int32
            type: integer
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: categoryId
          required: false
          schema:
            format: int32
            type: integer
    post:
      operationId: Create
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductResponse'
      description: Create a new product, only admins can create products
      tags:
        - Product
      security:
        - JWT_SECRET: []
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                categoryId:
                  type: string
                arName:
                  type: string
                enName:
                  type: string
                arDescription:
                  type: string
                enDescription:
                  type: string
                price:
                  type: string
                image:
                  type: string
                  format: binary
              required:
                - categoryId
                - arName
                - enName
                - arDescription
                - enDescription
                - price
                - image
  /api/v1/payments/{transactionId}:
    get:
      operationId: Get
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentResponse'
      tags:
        - Payment
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: transactionId
          required: true
          schema:
            type: string
  /api/v1/payments/void:
    post:
      operationId: Void
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                required:
                  - success
                type: object
      tags:
        - Payment
      security:
        - JWT_SECRET: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                transactionId:
                  type: string
              type: object
  /api/v1/payments/refund:
    post:
      operationId: Refund
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                required:
                  - success
                type: object
      tags:
        - Payment
      security:
        - JWT_SECRET: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                amount:
                  type: integer
                  format: int32
                transactionId:
                  type: string
              type: object
  /api/v1/orders:
    post:
      operationId: Create
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
      description: Creates a new order for current authenticated user
      tags:
        - Order
      security:
        - JWT_SECRET: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                addressId:
                  type: integer
                  format: int32
                note:
                  type: string
                paymentMethod:
                  type: string
                  enum:
                    - CARD
                    - CASH
              type: object
    get:
      operationId: List
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrdersResponse'
      description: List orders with pagination
      tags:
        - Order
      security:
        - JWT_SECRET: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            default: 1
            format: int32
            type: integer
        - in: query
          name: limit
          required: false
          schema:
            default: 10
            format: int32
            type: integer
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: userId
          required: false
          schema:
            format: int32
            type: integer
  /api/v1/orders/{orderId}:
    get:
      operationId: Get
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderResponse'
      description: Get order details **Only admins can access this endpoint**
      tags:
        - Order
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
    delete:
      operationId: Delete
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOrderResponse'
      description: Delete order, Order details will not deleted from database, it will
        just marked as canceled **Only admins can access this endpoint**
      tags:
        - Order
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
        - in: query
          name: userId
          required: false
          schema:
            type: string
    patch:
      operationId: UpdateStatus
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrderResponse'
      description: Update order status **Only admins can access this endpoint**
      tags:
        - Order
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                paymentStatus:
                  type: string
                  enum:
                    - UNPAID
                    - PAID
                    - FAILED
                    - VOIDED
                    - REFUNDED
                orderStatus:
                  type: string
                  enum:
                    - PENDING
                    - FULFILLED
                    - SHIPPED
                    - DELIVERED
                    - CANCELLED
              type: object
  /api/v1/images:
    get:
      operationId: List
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListImagesResponse'
      tags:
        - Image
      security:
        - JWT_SECRET: []
      parameters:
        - in: query
          name: productId
          required: false
          schema:
            format: int32
            type: integer
        - in: query
          name: colorId
          required: false
          schema:
            format: int32
            type: integer
    post:
      operationId: Create
      responses:
        '201':
          description: Image created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateImageResponse'
      tags:
        - Image
      security:
        - JWT_SECRET: []
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                colorId:
                  type: string
                productId:
                  type: string
                images:
                  items:
                    type: string
                    format: binary
                  type: array
              required:
                - colorId
                - productId
                - images
  /api/v1/images/{imageId}:
    patch:
      operationId: Update
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateImageResponse'
      tags:
        - Image
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: imageId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                isPrimary:
                  type: boolean
              type: object
    delete:
      operationId: Delete
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateImageResponse'
      tags:
        - Image
      security:
        - JWT_SECRET: []
      parameters:
        - in: path
          name: imageId
          required: true
          schema:
            type: string
  /api/v1/discounts/{discountId}:
    get:
      operationId: Get
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDiscountResponse'
      tags:
        - Discount
      security: []
      parameters:
        - in: path
          name: discountId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            format: int32
            type: integer
        - in: query
          name: page
          required: false
          schema:
