openapi: 3.0.0
info:
  title: "@resala/server"
  version: 1.0.0
  description: Resala server
  license:
    name: ISC
  contact:
    name: Hossam Hamdy
paths:
  /api/v1/users/{userId}:
    get:
      operationId: GetUser
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponse"
      tags:
        - User
      security:
        - jwt_auth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            format: double
            type: number
    delete:
      operationId: DeleteUser
      responses:
        "200":
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUserResponse"
      tags:
        - User
      security:
        - jwt_auth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            format: double
            type: number
    put:
      operationId: UpdateUser
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserResponse"
      tags:
        - User
      security:
        - jwt_auth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            format: double
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                role:
                  type: string
                  enum:
                    - ADMIN
                    - CUSTOMER
                    - MODERATOR
                lastName:
                  type: string
                firstName:
                  type: string
                phone:
                  type: string
                isVerified:
                  type: boolean
              type: object
  /api/v1/users:
    get:
      operationId: ListUsers
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
      tags:
        - User
      security:
        - jwt_auth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: page
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: query
          required: false
          schema:
            type: string
  /api/v1/reviews:
    post:
      operationId: CreateReview
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReviewResponse"
      tags:
        - Review
      security:
        - jwt_auth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                comment:
                  type: string
                rating:
                  type: number
                  format: double
                productId:
                  type: number
                  format: double
                userId:
                  type: number
                  format: double
              type: object
    get:
      operationId: ListReviews
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListReviewsResponse"
      tags:
        - Review
      security:
        - jwt_auth: []
      parameters:
        - in: query
          name: productId
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: limit
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: page
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: query
          required: false
          schema:
            type: string
  /api/v1/reviews/{reviewId}:
    put:
      operationId: UpdateReview
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateReviewResponse"
      tags:
        - Review
      security:
        - jwt_auth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                comment:
                  type: string
                rating:
                  type: number
                  format: double
                productId:
                  type: number
                  format: double
                userId:
                  type: number
                  format: double
              type: object
    delete:
      operationId: DeleteReview
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteReviewResponse"
      tags:
        - Review
      security:
        - jwt_auth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: {}
        - in: query
          name: userId
          required: false
          schema:
            format: double
            type: number
    get:
      operationId: GetReview
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetReviewResponse"
      tags:
        - Review
      security:
        - jwt_auth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: {}
  /api/v1/categories/{categoryId}:
    get:
      operationId: Get
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCategoryResponse"
      tags:
        - Category
      security: []
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            format: double
            type: number
    put:
      operationId: Update
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCategoryResponse"
      description: Update a category, only admins can update categories
      tags:
        - Category
      security:
        - jwt_auth: []
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            format: double
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                enName:
                  type: string
                arName:
                  type: string
              type: object
    delete:
      operationId: Delete
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteCategoryResponse"
      description: Delete a category, only admins can delete categories
      tags:
        - Category
      security:
        - jwt_auth: []
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            format: double
            type: number
  /api/v1/categories:
    get:
      operationId: List
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCategoriesResponse"
      tags:
        - Category
      security: []
      parameters: []
    post:
      operationId: Create
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCategoryResponse"
      description: Create a new category, only admins can create categories
      tags:
        - Category
      security:
        - jwt_auth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                enName:
                  type: string
                arName:
                  type: string
              type: object
  /api/v1/auth/login:
    post:
      operationId: Login
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
      tags:
        - Auth
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                sign:
                  type: string
                password:
                  type: string
              type: object
  /api/v1/auth/register:
    post:
      operationId: Register
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
      tags:
        - Auth
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                password:
                  type: string
                lastName:
                  type: string
                firstName:
                  type: string
                phone:
                  type: string
                email:
                  type: string
              type: object
  /api/v1/auth/refresh:
    post:
      operationId: Refresh
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
      tags:
        - Auth
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                token:
                  type: string
              type: object
  /api/v1/auth/verify-email:
    get:
      operationId: VerifyEmail
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEmailResponse"
      tags:
        - Auth
      security: []
      parameters:
        - in: query
          name: token
          required: false
          schema:
            type: string
        - in: query
          name: email
          required: false
          schema:
            type: string
  /api/v1/auth/forgot-password:
    post:
      operationId: ForgotPassword
      responses:
        "200":
          description: Password reset code sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"
      tags:
        - Auth
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
              type: object
  /api/v1/auth/reset-password:
    post:
      operationId: ResetPassword
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
      tags:
        - Auth
      security:
        - jwt_auth:
            - reset_password
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                password:
                  type: string
                email:
                  type: string
                code:
                  type: string
              type: object
  /api/v1/auth/resend-email-verification:
    get:
      operationId: ResendVerificationEmail
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendVerificationEmailResponse"
      tags:
        - Auth
      security:
        - jwt_auth: []
      parameters: []
  /api/v1/addresses:
    get:
      operationId: ListUserAddress
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAddressResponse"
      tags:
        - Address
      security:
        - jwt_auth: []
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            format: double
            type: number
    post:
      operationId: CreateUserAddress
      responses:
        "201":
          description: Address created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAddressResponse"
      tags:
        - Address
      security:
        - jwt_auth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                address:
                  type: string
                floor:
                  type: number
                  format: double
                building:
                  type: string
                country:
                  type: string
                street:
                  type: string
                city:
                  type: string
                state:
                  type: string
                lastName:
                  type: string
                firstName:
                  type: string
                phone:
                  type: string
                userId:
                  type: number
                  format: double
              type: object
  /api/v1/addresses/{addressId}:
    put:
      operationId: UpdateUserAddress
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAddressResponse"
      tags:
        - Address
      security:
        - jwt_auth: []
      parameters:
        - in: path
          name: addressId
          required: true
          schema:
            format: double
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                address:
                  type: string
                floor:
                  type: number
                  format: double
                building:
                  type: string
                country:
                  type: string
                street:
                  type: string
                city:
                  type: string
                state:
                  type: string
                lastName:
                  type: string
                firstName:
                  type: string
                phone:
                  type: string
                userId:
                  type: number
                  format: double
              type: object
    delete:
      operationId: DeleteUserAddress
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAddressResponse"
      tags:
        - Address
      security:
        - jwt_auth: []
      parameters:
        - in: path
          name: addressId
          required: true
          schema:
            format: double
            type: number
        - in: query
          name: userId
          required: true
          schema:
            format: double
            type: number
components:
  examples: {}
  headers: {}
  parameters: {}
  requestBodies: {}
  responses: {}
  schemas:
    DefaultResponseBody:
      properties:
        message:
          type: string
        success:
          type: boolean
      required:
        - success
      type: object
    RoleType:
      type: string
      enum:
        - ADMIN
        - CUSTOMER
        - MODERATOR
      nullable: false
    User:
      properties:
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        lastLogin:
          type: string
          format: date-time
          nullable: true
        role:
          $ref: "#/components/schemas/RoleType"
        lastName:
          type: string
        firstName:
          type: string
        phone:
          type: string
        isVerified:
          type: boolean
        email:
          type: string
        id:
          type: number
          format: double
      required:
        - updatedAt
        - createdAt
        - lastLogin
        - role
        - lastName
        - firstName
        - phone
        - isVerified
        - email
        - id
      type: object
    GetUserResponse:
      allOf:
        - $ref: "#/components/schemas/DefaultResponseBody"
        - properties:
            data:
              $ref: "#/components/schemas/User"
          required:
            - data
          type: object
    Pagination:
      properties:
        total:
          type: number
          format: double
        limit:
          type: number
          format: double
        page:
          type: number
          format: double
      required:
        - total
        - limit
        - page
      type: object
    ListUsersResponse:
      allOf:
        - $ref: "#/components/schemas/DefaultResponseBody"
        - properties:
            data:
              properties:
                users:
                  items:
                    $ref: "#/components/schemas/User"
                  type: array
                pagination:
                  $ref: "#/components/schemas/Pagination"
              required:
                - users
                - pagination
              type: object
          required:
            - data
          type: object
    DeleteUserResponse:
      $ref: "#/components/schemas/DefaultResponseBody"
    UpdateUserResponse:
      allOf:
        - $ref: "#/components/schemas/DefaultResponseBody"
        - properties:
            data:
              $ref: "#/components/schemas/User"
          required:
            - data
          type: object
    Review:
      properties:
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        comment:
          type: string
          nullable: true
        rating:
          type: number
          format: double
        userId:
          type: number
          format: double
          nullable: true
        productId:
          type: number
          format: double
        id:
          type: number
          format: double
      required:
        - updatedAt
        - createdAt
        - comment
        - rating
        - userId
        - productId
        - id
      type: object
    CreateReviewResponse:
      allOf:
        - $ref: "#/components/schemas/DefaultResponseBody"
        - properties:
            data:
              $ref: "#/components/schemas/Review"
          required:
            - data
          type: object
    UpdateReviewResponse:
      $ref: "#/components/schemas/CreateReviewResponse"
    DeleteReviewResponse:
      $ref: "#/components/schemas/CreateReviewResponse"
    Decimal:
      type: string
    Product:
      properties:
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        imageUrl:
          type: string
        imageKey:
          type: string
        price:
          anyOf:
            - type: number
              format: double
            - $ref: "#/components/schemas/Decimal"
            - type: string
            - {}
        enDescription:
          type: string
        arDescription:
          type: string
        enName:
          type: string
        arName:
          type: string
        categoryId:
          type: number
          format: double
        id:
          type: number
          format: double
      required:
        - updatedAt
        - createdAt
        - imageUrl
        - imageKey
        - price
        - enDescription
        - arDescription
        - enName
        - arName
        - categoryId
        - id
      type: object
    GetReviewResponse:
      allOf:
        - $ref: "#/components/schemas/DefaultResponseBody"
        - properties:
            data:
              allOf:
                - $ref: "#/components/schemas/Review"
                - properties:
                    product:
                      $ref: "#/components/schemas/Product"
                    user:
                      allOf:
                        - $ref: "#/components/schemas/User"
                      nullable: true
                  required:
                    - product
                    - user
                  type: object
          required:
            - data
          type: object
    ListReviewsResponse:
      allOf:
        - $ref: "#/components/schemas/DefaultResponseBody"
        - properties:
            data:
              properties:
                reviews:
                  items:
                    allOf:
                      - $ref: "#/components/schemas/Review"
                      - properties:
                          product:
                            $ref: "#/components/schemas/Product"
                          user:
                            allOf:
                              - $ref: "#/components/schemas/User"
                            nullable: true
                        required:
                          - product
                          - user
                        type: object
                  type: array
                pagination:
                  $ref: "#/components/schemas/Pagination"
              required:
                - reviews
                - pagination
              type: object
          required:
            - data
          type: object
    Category:
      properties:
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        enName:
          type: string
        arName:
          type: string
        id:
          type: number
          format: double
      required:
        - updatedAt
        - createdAt
        - enName
        - arName
        - id
      type: object
    GetCategoryResponse:
      allOf:
        - $ref: "#/components/schemas/DefaultResponseBody"
        - properties:
            data:
              $ref: "#/components/schemas/Category"
          required:
            - data
          type: object
    ListCategoriesResponse:
      allOf:
        - $ref: "#/components/schemas/DefaultResponseBody"
        - properties:
            data:
              items:
                $ref: "#/components/schemas/Category"
              type: array
          required:
            - data
          type: object
    CreateCategoryResponse:
      $ref: "#/components/schemas/GetCategoryResponse"
    UpdateCategoryResponse:
      $ref: "#/components/schemas/GetCategoryResponse"
    DeleteCategoryResponse:
      $ref: "#/components/schemas/GetCategoryResponse"
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/DefaultResponseBody"
        - properties:
            data:
              properties:
                user:
                  $ref: "#/components/schemas/User"
                refreshToken:
                  type: string
                accessToken:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
              required:
                - user
                - refreshToken
                - accessToken
                - expiresAt
              type: object
          required:
            - data
          type: object
    RegisterResponse:
      $ref: "#/components/schemas/DefaultResponseBody"
    RefreshTokenResponse:
      allOf:
        - $ref: "#/components/schemas/DefaultResponseBody"
        - properties:
            data:
              properties:
                refreshToken:
                  type: string
                accessToken:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
              required:
                - refreshToken
                - accessToken
                - expiresAt
              type: object
          required:
            - data
          type: object
    VerifyEmailResponse:
      $ref: "#/components/schemas/DefaultResponseBody"
    ForgotPasswordResponse:
      allOf:
        - $ref: "#/components/schemas/DefaultResponseBody"
        - properties:
            data:
              properties:
                expiresAt:
                  type: string
                  format: date-time
                resetToken:
                  type: string
              required:
                - expiresAt
                - resetToken
              type: object
          required:
            - data
          type: object
    ResetPasswordResponse:
      $ref: "#/components/schemas/DefaultResponseBody"
    ResendVerificationEmailResponse:
      $ref: "#/components/schemas/DefaultResponseBody"
    Address:
      properties:
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        lastName:
          type: string
        firstName:
          type: string
        phone:
          type: string
        address:
          type: string
          nullable: true
        floor:
          type: number
          format: double
          nullable: true
        building:
          type: string
          nullable: true
        street:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        id:
          type: number
          format: double
      required:
        - updatedAt
        - createdAt
        - lastName
        - firstName
        - phone
        - address
        - floor
        - building
        - street
        - city
        - state
        - country
        - id
      type: object
    ListAddressResponse:
      allOf:
        - $ref: "#/components/schemas/DefaultResponseBody"
        - properties:
            data:
              items:
                $ref: "#/components/schemas/Address"
              type: array
          required:
            - data
          type: object
    GetAddressResponse:
      allOf:
        - $ref: "#/components/schemas/DefaultResponseBody"
        - properties:
            data:
              $ref: "#/components/schemas/Address"
          required:
            - data
          type: object
    CreateAddressResponse:
      $ref: "#/components/schemas/GetAddressResponse"
    UpdateAddressResponse:
      $ref: "#/components/schemas/GetAddressResponse"
    DeleteAddressResponse:
      $ref: "#/components/schemas/GetAddressResponse"
  securitySchemes:
    jwt_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
  - url: http://localhost:5000
    description: Local development
  - url: http://ec2-13-49-159-109.eu-north-1.compute.amazonaws.com
    description: Development server
