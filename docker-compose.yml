version: '3.9'

services:
  db:
    image: postgres
    restart: always
    container_name: resala-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    # ports:
    #   - '5432:5432'

  server:
    restart: always
    build:
      context: ./
      dockerfile: Dockerfile.server
    container_name: ${SERVER_HOST}
    env_file: .env
    volumes:
      - uploads:/app/server/uploads
    depends_on:
      - db
    command: >
      sh -c "cd server && npx prisma migrate dev && yarn start"
    # ports:
    #   - ${SERVER_PORT}:${SERVER_PORT}

  nginx:
    restart: always
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ${NGINX_HOST}
    volumes:
      - uploads:/app/server/uploads
    env_file: .env
    ports:
      - ${NGINX_PORT}:${NGINX_PORT}
      - ${NGINX_PORT_SSL}:${NGINX_PORT_SSL}
    depends_on:
      - server

volumes:
  db-data:
  uploads:
