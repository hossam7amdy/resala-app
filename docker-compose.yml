services:
  db:
    image: postgres
    restart: always
    container_name: resala-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - resala-net

  s3:
    image: minio/minio
    restart: always
    container_name: resala-s3
    environment:
      MINIO_ROOT_USER: minio_key
      MINIO_ROOT_PASSWORD: minio_secret
    volumes:
      - s3-data:/mnt/data
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      - resala-net
    command: minio server /data --console-address :9001

  server:
    restart: always
    build:
      context: ./
      dockerfile: Dockerfile.server
    container_name: resala-server
    image: hossam7amdy/resala-server
    depends_on:
      - db
      - s3
    volumes:
      - resala-uploads:/usr/src/app/packages/server/uploads
    ports:
      - 5000:5000
    env_file:
      - .env.docker
    networks:
      - resala-net

volumes:
  db-data:
  s3-data:
  resala-uploads:

networks:
  resala-net:
    driver: bridge
