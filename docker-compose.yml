services:
  db:
    image: postgres
    restart: always
    container_name: resala-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - resala-net

  s3:
    image: minio/minio
    restart: always
    container_name: resala-s3
    environment:
      MINIO_ROOT_USER: minio_key
      MINIO_ROOT_PASSWORD: minio_secret
    volumes:
      - s3-data:/mnt/data
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      - resala-net
    command: 'minio server /data --console-address :9001'

  server:
    restart: always
    build:
      context: ./
      dockerfile: Dockerfile.server
    container_name: resala-server
    image: hossam7amdy/resala-server
    depends_on:
      - db
      - s3
    volumes:
      - resala-uploads:/usr/src/app/packages/server/uploads
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=development
      - APP_URL=http://localhost:5000
      - JWT_SECRET=jwt_secret
      - JWT_REFRESH=jwt_refresh
      - JWT_RESET=jwt_reset
      - JWT_VERIFY=jwt_verify
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/resala
      - MAIL_USER=user@mail.com
      - MAIL_PASS=password
      - TWILIO_ACCOUNT_SID=ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      - TWILIO_AUTH_TOKEN=your_auth_token
      - TWILIO_PHONE_NUMBER=+1234567890
      - PAYMOB_INTEGRATION_ID=123456
      - PAYMOB_BASE_URL=https://accept.paymob.com/api
      - PAYMOB_HMAC_KEY=your_hmac_key
      - PAYMOB_API_TOKEN=your_api_token
      - S3_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minio_key
      - AWS_SECRET_ACCESS_KEY=minio_secret
      - S3_BUCKET=resala-app
      - S3_ENDPOINT=http://s3:9000
      - S3_BASE_URL=http://localhost:9000/resala-app
    networks:
      - resala-net

volumes:
  db-data:
  s3-data:
  resala-uploads:

networks:
  resala-net:
    driver: bridge
